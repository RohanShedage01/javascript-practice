<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            height: 500px;
            width: 500px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="box" onmouseover="func1()" onmousemove="func2()" onmouseout="func3()"></div>
</body>

<script>
    function func1() {
        console.log("mouse over ");
    }

    function func2() {
        console.log("mouse move ");
    }

    function func3() {
        console.log("mouse out");
    }
</script>
</html>
