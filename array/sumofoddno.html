<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find the sum of odd number in array</title>
</head>
<body>
    <script>
        let arr=[5,10,12,25];
        let sum=0;

        for (let i=0;i<=3;i++){
            if(arr[i] % 2!=0){
                sum+=arr[i]
            }
        }
        console.log("sum of odd number:",sum);
    </script>
</body>
</html>
