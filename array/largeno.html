<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the largest number from given array</title>
</head>
<body>
    <script>
        let marks = [35, 50, 45, 60, 70, 87, 96];
        let largest = marks[0]; // starting with first element

        for (let i = 0; i < marks.length; i++) {
            if (marks[i] >= largest) {
                largest = marks[i]; // update largest
            }
        }

        console.log("Largest number is:", largest);
    </script>
</body>
</html>
