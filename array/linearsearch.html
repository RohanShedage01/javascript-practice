<!DOCTYPE html>
<html>
<head>
  <title>Simple Linear Search</title>
</head>
<body>

<script>
  let numbers = [5, 10, 15, 20];
  let searchValue = 15;

  for (let i = 0; i < numbers.length; i++) {
    if (numbers[i] == searchValue) {
      console.log("Value found at index " + i);
      break;
    }
  }
</script>

</body>
</html>
