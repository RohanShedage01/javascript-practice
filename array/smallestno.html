<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the smallest number from given array</title>
</head>
<body>
    <script>
        let marks = [35, 50, 45, 60, 70, 87, 96];
        let smallest = marks[0]; 

        for (let i = 0; i <= 6; i++) {
            if (marks[i] <= smallest) {
                smallest = marks[i];
            }
        }

        console.log("smallest number is:", smallest);
    </script>
</body>
</html>
