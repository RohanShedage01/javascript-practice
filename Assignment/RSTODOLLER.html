<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rupee to Dollar Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    input {
      width: 300px;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: red;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: red;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      border-radius: 20px;
      transform: scale(1.03);
      transition: 0.2s;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Rupee to Dollar Converter</h2>
    <input type="number" id="rupees" placeholder="Enter amount in Rupees" />
    <button onclick="convert()">Convert</button>
    <div class="result" id="result">$0</div>
  </div>

  <script>
    function convert() {
      let rupees = document.getElementById("rupees").value;
      let rate = 83; 

      let dollars = (rupees / rate).toFixed(2);
      document.getElementById("result").innerText = `$${dollars}`;
    }
  </script>
</body>
</html>
