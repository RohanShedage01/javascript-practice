<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centimeter to Inches Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input {
      width: 300px;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    button:hover {
      background: #e68900;
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
      border-radius: 20px;
      transform: scale(1.04);
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Centimeter to Inches Converter</h2>
    <input type="number" id="cm" placeholder="Enter centimeters" />
    <button onclick="convert()">Convert</button>
    <div class="result" id="result">0 inches</div>
  </div>

  <script>
    function convert() {
      let cm = document.getElementById("cm").value;
      let inches = (cm / 2.54).toFixed(2);
      document.getElementById("result").innerText = `${inches} inches`;
    }
  </script>
</body>
</html>
