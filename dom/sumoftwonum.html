<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Program</title>

    <style>
        .design {
            border: 5px solid black; 
            height: 200px;  
            background-color: antiquewhite;
            text-align: center;
            padding-top: 20px;
        }

        .io {
            display: block;
            margin: 10px auto;
            border-radius: 10px;
            font-size: large;
            text-align: center;
            padding: 8px;
            width: 250px;
        }

        .btn {
            background-color: brown;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

    <div class="design">
        <input class="io" id="num1" type="text" placeholder="Enter first number">
        <input class="io" id="num2" type="text" placeholder="Enter second number">
        <button class="btn" onclick="sum()">Sum</button>
        <p id="sum-result">sum : 0</p>
    </div>
</body>

<script>
    function sum() {
       const a = Number(document.getElementById("num1").value);
       const b = Number(document.getElementById("num2").value);
       const totalsum = a + b ;

       const result = document.getElementById("sum-result");
       result.innerText = `sum: ${totalsum}`;
    }
</script>
</html>
